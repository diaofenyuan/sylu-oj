# Prometheus 抓取配置（Task 8，OPS 区运行）
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # API/Judge Gateway（独立管理端口 9091，仅 OPS/内网可达，网络 ACL 由 Task 2 承担）
  - job_name: oj-api
    static_configs:
      - targets: ["api-vm:9091"]

  # 入口 Nginx 与主机节点
  - job_name: node
    static_configs:
      - targets: ["dmz-vm:9100", "api-vm:9100", "data-vm:9100", "judge-vm:9100", "ops-vm:9100"]

  # Vector 日志管道心跳（断流检测）
  - job_name: vector
    static_configs:
      - targets: ["api-vm:9598", "judge-vm:9598"]
