# 单元/集成测试环境：H2 内存库（MySQL 兼容模式）+ OJ 合成账号（仅合成数据）。
# 教务适配器使用模拟器（simulated）：TeachingLoginTest 验证登录、熔断与无降级。
spring:
  datasource:
    url: jdbc:h2:mem:ojtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 30

oj:
  auth:
    local-accounts-enabled: true
    bootstrap-admin:
      login: test-admin
      password: test-admin-password
  identity:
    education:
      enabled: true
      provider: simulated
      enforce-exclusive: false
      admin-staff-numbers: ADM-0001
    callback-whitelist: https://oj.test/api/identity/login/callback
    cookie-secure: false
    totp-encryption-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  dev-internal-api:
    enabled: true
    token: test-internal-token
  export:
    dir: target/oj-test-exports

logging:
  level:
    root: warn
    oj: info
