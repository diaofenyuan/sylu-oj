spring:
  application:
    name: oj-api
  profiles:
    default: prod
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8443
  error:
    include-stacktrace: never
    include-message: never

# 管理/指标端口与业务端口分离；网络 ACL（Task 2）仅允许 OPS 抓取 9091
management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: oj-api

oj:
  auth:
    # 生产环境禁止本地合成账号：教务网页登录适配器（Task 5）为生产唯一登录路径。
    local-accounts-enabled: false
    token-ttl-minutes: 720
  identity:
    # Access Token 10 分钟；刷新令牌单次轮换、可撤销（HttpOnly Cookie）
    access-token-ttl-minutes: 10
    refresh-token-ttl-hours: 12
    state-ttl-minutes: 5
    ticket-retention-minutes: 60
    enrollment-ttl-minutes: 30
    max-concurrent-sessions: 8
    cookie-secure: true
    cookie-same-site: Lax
    # 精确回调白名单（逗号分隔，禁止通配/前缀匹配），由部署环境注入
    callback-whitelist: ""
    # TOTP 密钥加密用 32 字节（64 位十六进制），生产经 systemd 凭据注入
    totp-encryption-key: ""
    education:
      enabled: false
      provider: simulated
      # true 时本地合成账号登录路径整体禁用（生产），教务不可用即拒绝新登录，无降级
      enforce-exclusive: false
      admin-staff-numbers: ""
      jxw:
        login-url: https://jxw.sylu.edu.cn/xtgl/login_slogin.html
        # 现场验收并登记责任人后由部署配置置 true，否则适配器拒绝服务
        certified: false
  export:
    dir: /var/lib/oj/exports
    token-ttl-minutes: 30
    file-retention-hours: 24
  dev-internal-api:
    enabled: false
    token: ""
  submission:
    max-code-bytes: 262144
  judge:
    # 事件通道：inline（dev/test，同事务派发）| rabbit（prod，Outbox 调度器经 TLS 发布）
    mq:
      mode: inline
      exchange: oj.judge
      queue: oj.judge.tasks
    outbox-poll-ms: 1000
    task-lease-seconds: 120
    claim-max-wait-seconds: 25
    se-max-retries: 3
    distribution:
      # 单 Agent 每分钟用例拉取阈值，超限熔断（P1）
      max-per-minute: 120
    # Agent 密钥静态加密密钥（64 位十六进制，生产经 systemd 凭据注入）
    crypto-key: ""
  pagination:
    max-page-size: 100
