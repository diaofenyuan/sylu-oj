# 生产环境配置模板：MySQL、禁用本地合成账号与内部联调接口。
# 真实密码/密钥通过环境变量或 systemd 凭据注入，不得写入仓库。
spring:
  datasource:
    url: jdbc:mysql://${OJ_DB_HOST:data-vm}:${OJ_DB_PORT:3306}/${OJ_DB_NAME:oj}?useSSL=true&requireSSL=true&verifyServerCertificate=true&serverTimezone=Asia/Shanghai
    username: ${OJ_DB_USER:oj_api}
    password: ${OJ_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

oj:
  auth:
    local-accounts-enabled: false
  dev-internal-api:
    enabled: false
  export:
    dir: /var/lib/oj/exports
