#!/usr/sbin/nft -f
# infra/host/nftables.conf —— KVM 宿主机主机级防火墙（Task 2）
#
# 宿主机只提供虚拟化与虚拟交换，不运行 Web/数据库/判题业务，也不在业务网段
# 配置三层地址。跨安全域路由由虚拟防火墙 VM（infra/libvirt/firewall/）完成，
# 本文件只保护宿主机自身（input/output），对业务网段默认不转发。
#
# 部署注意：
#   - 将 $mgmt_cidr 替换为中转机/明确管理源的真实地址（未确认前保持拒绝）；
#   - 将 $ops_proxy 替换为 OPS 区的受控更新代理地址；
#   - 安装时由 install.sh 校验本文件与真实网络一致后再加载。

flush ruleset

define mgmt_cidr = 192.0.2.0/24      # TODO: 中转机/管理源地址，部署前由网络管理员确认
define ops_proxy  = 10.20.5.10        # OPS 区受控更新代理（维护窗口出网 443 例外）
define ntp_servers = { 10.0.0.1, 10.0.0.2 }   # TODO: 校内 NTP 多源

table inet hostfw {
  set mgmt_addrs {
    type ipv4_addr
    flags interval
    elements = { $mgmt_cidr }
  }

  chain input {
    type filter hook input priority filter; policy drop;

    # 回环与已建立连接
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    # 运维 SSH（仅管理来源）
    tcp dport 22 ip saddr @mgmt_addrs accept

    # libvirt/qemu 管理（仅管理来源）
    tcp dport 16509 ip saddr @mgmt_addrs accept

    # 拒绝并记录其余入站
    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    # 宿主机不做业务网段三层转发；虚拟防火墙 VM 在二层桥接内自行路由
    ct state established,related accept
    counter drop
  }

  chain output {
    type filter hook output priority filter; policy drop;

    oif "lo" accept
    ct state established,related accept

    # 校内授时（优先 NTS，不具备时多源交叉校验）
    udp dport 123 ip daddr $ntp_servers accept

    # 维护窗口：经 OPS 受控代理访问更新源（TCP 443）
    tcp dport 443 ip daddr $ops_proxy accept

    # 宿主机日志/心跳推送到 OPS（TLS Syslog 6514）
    tcp dport 6514 ip daddr $ops_proxy accept

    counter drop
  }
}
