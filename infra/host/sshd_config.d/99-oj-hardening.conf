# /etc/ssh/sshd_config.d/99-oj-hardening.conf
# sylu-oj SSH 加固（Task 2）—— 由 install.sh 部署到宿主机与各业务 VM。
# 依据设计文档 3（无堡垒机时的补偿控制）与 docs/compliance/no-bastion-compensation.md。

# 禁止 root 直接登录，运维经个人账号 + sudo 提权
PermitRootLogin no

# 仅允许密钥认证，禁止密码与键盘交互
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

# 仅允许运维账号（部署时由 install.sh 按实际账号替换）
AllowUsers ojadmin

# 限制认证尝试与空闲超时
MaxAuthTries 3
ClientAliveInterval 300
ClientAliveCountMax 0

# 关闭不必要的能力
X11Forwarding no
AllowTcpForwarding no
