# toolchains.lock —— 固定工具链版本与校验和（Task 3）
#
# 依据设计文档第 7 节「基础镜像固定版本和摘要」与第 12.2 节「构建过程不得把
# 未锁定版本的依赖拉入发布包」。本文件由 CI 在每次版本化发布时锁定并校验，
# 任何变更必须随发布包升级，禁止运行时动态安装或升级。
#
# 格式：<name>  <version>  <sha256>
# sha256 为对应 .deb / 制品文件的校验和，占位符 TODO 由 CI 替换为真实值，
# 未替换的占位符在 release-integrity 验收中视为失败。

