# oj-judge-agent.service.d/10-hardening.conf —— Judge Agent + 沙箱启动器（Task 3）
# 判题边界：Agent 非 root；沙箱内每个 MicroVM 的资源配额由 cgroups v2 单独设置。
[Service]
User=judge
Group=judge
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
RestrictRealtime=true
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_VSOCK
ReadOnlyPaths=/opt/oj
ReadWritePaths=/var/lib/oj /var/log/oj
InaccessiblePaths=/var/run/docker.sock /run/docker.sock /var/lib/mysql /var/lib/redis /var/lib/rabbitmq
MemoryMax=12G
CPUQuota=600%
TasksMax=2048
LimitNOFILE=65536
UMask=0077
