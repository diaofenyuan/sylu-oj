# oj-ingress —— DMZ 唯一入口 Nginx 配置（Task 8，设计 3.1 / 5.4）
#
# 部署位置：DMZ VM /etc/nginx/nginx.conf 中 http{} 内 include。
# 内测模式（无域名已确认 2026-08-29）：
#   - 使用自签名证书（infra/ingress/gen-selfsigned-cert.sh 生成，部署时替换路径）；
#   - 仅允许内测地址段访问（allow/deny 列表由部署注入，下方为占位）；
#   - 首次访问必须看到内测明示（X-OJ-Stage: internal-beta + / 页面横幅），
#     不得用于正式考试；
#   - 服务器不直接公网暴露：本机防火墙仅放行中转机/VPN 来源到 8443。
#
# 只转发 Web/API；判题网关（/api/judge/v1）经 API VM mTLS 直连，不经本入口公网路径。
# 管理面（/internal/**、actuator）一律拒绝经入口访问。

# ---- 限流（按账号/题目维度的精细限流在应用侧；此处为 IP 辅助层） ----
limit_req_zone $binary_remote_addr zone=oj_login:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=oj_submit:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=oj_global:10m  rate=120r/m;
limit_conn_zone $binary_remote_addr zone=oj_conn:10m;

server {
    # 80 仅作跳转；正式流量全部 8443 TLS
    listen 80;
    server_name _;
    location = /healthz { return 200 "ok\n"; }
    location / { return 301 https://$host:8443$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # ---- TLS（内测自签名；取得可信 HTTPS 后按 Runbook 替换并启用 OCSP）----
    ssl_certificate     /etc/oj-ingress/tls/ingress.crt;
    ssl_certificate_key /etc/oj-ingress/tls/ingress.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ---- 内测地址白名单（部署时注入内测网段；未匹配一律 403）----
    # allow 10.8.0.0/24;   # 校园 VPN 内测段（示例占位）
    # allow 192.168.30.0/24;
    # deny all;

    # ---- 连接与请求体限制 ----
    limit_conn  oj_conn 20;
    client_max_body_size 1m;   # 代码提交上限 256KB，留裕量
    client_body_timeout 15s;
    client_header_timeout 10s;

    # ---- 安全头（内测也全量启用）----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # 内测明示头：前端据此渲染内测横幅（师生使用前必须看到）
    add_header X-OJ-Stage "internal-beta" always;
    add_header Cache-Control "no-store" always;

    # ---- CORS：仅前端自身来源，凭据模式（部署注入）----
    # set $cors_origin "https://oj.internal-beta.example";
    # if ($http_origin = $cors_origin) {
    #     add_header Access-Control-Allow-Origin $cors_origin always;
    #     add_header Access-Control-Allow-Credentials "true" always;
    #     add_header Vary "Origin" always;
    # }

    # ---- 静态前端（Web 区）----
    location / {
        proxy_pass https://web-vm:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        limit_req zone=oj_global burst=60 nodelay;
    }

    # ---- API（Web/API 区 Spring Boot）----
    location /api/ {
        proxy_pass https://api-vm:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        limit_req zone=oj_global burst=60 nodelay;
    }

    # 登录/教务适配：更严格限流（防撞库/暴力登录的 IP 辅助层）
    location = /api/auth/login {
        proxy_pass https://api-vm:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=oj_login burst=3 nodelay;
    }
    location /api/identity/ {
        proxy_pass https://api-vm:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=oj_login burst=3 nodelay;
    }
    # 学生提交：独立限流桶
    location = /api/student/submissions {
        proxy_pass https://api-vm:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=oj_submit burst=10 nodelay;
    }

    # ---- 一律拒绝：判题网关、内部接口、管理端点、特设探测路径 ----
    location /api/judge/v1/ { return 403; }
    location /internal/     { return 403; }
    location /actuator/     { return 403; }
    location = /phpmyadmin  { return 403; }
    location = /.env        { return 403; }
    location = /.git        { return 403; }

    # ---- 日志（rsyslog 采集转发 OPS，TLS；断流 5 分钟 P1）----
    access_log /var/log/nginx/oj-ingress-access.log combined;
    error_log  /var/log/nginx/oj-ingress-error.log warn;
}
